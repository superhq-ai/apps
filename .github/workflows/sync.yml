name: sync

# Tells the console the catalog changed. The call carries only the OIDC
# token of this run; the console reads the head of main itself.
on:
  push:
    branches: [main]

permissions:
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync the catalog
        run: |
          set -eu
          TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://app.superhq.ai" | jq -r .value)"
          echo "::add-mask::$TOKEN"
          curl -fsS --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://app.superhq.ai/api/catalog/sync
